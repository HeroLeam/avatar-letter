<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Emby - Avatar Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@700;900&family=Fira+Code:wght@500;700&family=Montserrat:wght@700;900&family=Bebas+Neue&family=Pacifico&family=Cinzel:wght@700&family=Permanent+Marker&display=swap"
        rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="header-brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1>Avatar Emby</h1>
                    <p data-i18n="subtitle">Typography avatar creator</p>
                </div>
            </div>
            <button onclick="resetDefaults()" class="btn-secondary">
                <i class="fa-solid fa-rotate-right"></i>
                <span data-i18n="reset_btn">Reset Defaults</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Preview & Download Section -->
        <div class="preview-section">
            <div class="avatar-wrapper">
                <div id="preview-glow" class="preview-glow"></div>
                <div id="avatar-container" class="avatar-container">
                    <span id="avatar-text">A</span>
                    <div id="avatar-nsfw-tag" class="avatar-nsfw-tag hidden">NSFW</div>
                </div>
            </div>

            <div class="action-buttons">
                <button onclick="downloadAvatar()" class="btn-primary">
                    <i class="fa-solid fa-download"></i>
                    <span data-i18n="download_btn">Download High-Res PNG</span>
                </button>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <h2>
                <i class="fa-solid fa-sliders"></i>
                <span data-i18n="panel_title">Customization</span>
            </h2>

            <!-- Avatar Text -->
            <div class="control-group">
                <label for="input-text">
                    <span data-i18n="label_text">Avatar Text</span>
                    <span class="label-hint" data-i18n="hint_text">Recommended: 1 to 3 chars</span>
                </label>
                <input type="text" id="input-text" value="A" maxlength="5" oninput="updateText(this.value)">
            </div>

            <!-- NSFW Tag Settings -->
            <div class="nsfw-box">
                <label class="checkbox-label">
                    <input type="checkbox" id="input-nsfw-check" onchange="updateNsfwActive(this.checked)">
                    <span data-i18n="label_nsfw_toggle">Show Corner Tag (e.g., NSFW)</span>
                </label>

                <div id="nsfw-options" class="nsfw-sub-options hidden">
                    <div class="nsfw-grid">
                        <div class="control-subgroup">
                            <label data-i18n="label_nsfw_text">Tag Text</label>
                            <input type="text" id="input-nsfw-text" value="NSFW" maxlength="8"
                                oninput="updateNsfwText(this.value)">
                        </div>
                        <div class="control-subgroup">
                            <label data-i18n="label_nsfw_color">Tag Color</label>
                            <div class="color-input-wrapper">
                                <input type="color" id="input-nsfw-color" value="#ff3399"
                                    oninput="updateNsfwColor(this.value)">
                                <input type="text" id="text-nsfw-color" value="#FF3399"
                                    onchange="updateNsfwColor(this.value)">
                            </div>
                        </div>
                        <div class="control-subgroup">
                            <label data-i18n="label_nsfw_position">Position</label>
                            <select id="input-nsfw-position" onchange="updateNsfwPosition(this.value)">
                                <option value="top-left" data-i18n="pos_top_left">Top Left</option>
                                <option value="top-right" data-i18n="pos_top_right">Top Right</option>
                                <option value="bottom-left" data-i18n="pos_bottom_left">Bottom Left</option>
                                <option value="bottom-right" selected data-i18n="pos_bottom_right">Bottom Right</option>
                            </select>
                        </div>
                    </div>

                    <div class="control-subgroup">
                        <div class="slider-header">
                            <label data-i18n="label_nsfw_size">Tag Size</label>
                            <span id="nsfw-size-value" class="value-display">20px</span>
                        </div>
                        <input type="range" id="input-nsfw-size" min="10" max="48" step="1" value="20"
                            oninput="updateNsfwSize(this.value)">
                    </div>
                </div>
            </div>

            <!-- Color Pickers (Background & Text) -->
            <div class="color-pickers-grid">
                <!-- Background Color -->
                <div class="control-group">
                    <div class="label-with-action">
                        <label data-i18n="label_bg_color">Background Color</label>
                        <button onclick="randomizeBgColor()" class="btn-text">
                            <i class="fa-solid fa-dice"></i> <span data-i18n="btn_random">Random</span>
                        </button>
                    </div>
                    <div class="color-input-wrapper">
                        <input type="color" id="input-bg-color" value="#3b5323" oninput="updateBgColor(this.value)">
                        <input type="text" id="text-bg-color" value="#3B5323" onchange="updateBgColor(this.value)">
                    </div>
                </div>

                <!-- Text Color -->
                <div class="control-group">
                    <div class="label-with-action">
                        <label data-i18n="label_text_color">Text Color</label>
                        <button onclick="randomizeTextColor()" class="btn-text">
                            <i class="fa-solid fa-dice"></i> <span data-i18n="btn_random">Random</span>
                        </button>
                    </div>
                    <div class="color-input-wrapper">
                        <input type="color" id="input-text-color" value="#000000" oninput="updateTextColor(this.value)">
                        <input type="text" id="text-text-color" value="#000000" onchange="updateTextColor(this.value)">
                    </div>
                </div>
            </div>

            <!-- Font Family -->
            <div class="control-group">
                <div class="label-with-action">
                    <label data-i18n="label_font_style">Font Style</label>
                    <button onclick="randomizeFont()" class="btn-text">
                        <i class="fa-solid fa-dice"></i> <span data-i18n="btn_random_font">Random Font</span>
                    </button>
                </div>
                <div class="font-options-grid" id="font-options">
                    <!-- Generated via JS -->
                </div>
            </div>

            <!-- Font Size -->
            <div class="control-group">
                <div class="slider-header">
                    <label data-i18n="label_font_size">Font Size</label>
                    <div class="number-input-wrap">
                        <input type="number" id="input-size-num" value="16" min="1" step="0.5"
                            oninput="updateFontSize(this.value, true)">
                        <span class="unit">rem</span>
                    </div>
                </div>
                <input type="range" id="input-size" min="1" max="25" step="0.5" value="16"
                    oninput="updateFontSize(this.value, false)">
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer" data-i18n="footer_text">
        Avatar Emby &bull; Built for interactive web use
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        <i class="fa-solid fa-circle-check" id="toast-icon"></i>
        <span id="toast-msg">Avatar saved successfully!</span>
    </div>

    <!-- External JS Files -->
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>

</html>
